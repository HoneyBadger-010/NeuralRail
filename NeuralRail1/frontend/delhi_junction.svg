<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1710 900" width="1710" height="900">
  <defs>
    <style>
      .bg { fill: #0a1628; }
      .track-north { stroke: #00ff88; stroke-width: 5; stroke-linecap: round; fill: none; }
      .track-south { stroke: #00d4ff; stroke-width: 5; stroke-linecap: round; fill: none; }
      .track-east { stroke: #ff6b35; stroke-width: 5; stroke-linecap: round; fill: none; }
      .track-west { stroke: #a855f7; stroke-width: 5; stroke-linecap: round; fill: none; }
      .station-marker { fill: #ffffff; stroke: #00d4ff; stroke-width: 2; }
      .junction-marker { fill: #ff6b35; stroke: #ffffff; stroke-width: 2; }
      .hub-marker { fill: #00d4ff; stroke: #ffffff; stroke-width: 3; }
      .station-label { fill: #ffffff; font-size: 11px; font-weight: 600; font-family: 'Segoe UI', Arial, sans-serif; }
      .station-km { fill: #00d4ff; font-size: 9px; font-family: 'Segoe UI', Arial, sans-serif; }
      .junction-km { fill: #ff6b35; font-size: 9px; font-family: 'Segoe UI', Arial, sans-serif; }
      .direction-label { fill: #ffcc00; font-size: 13px; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif; }
      .distance-label { fill: rgba(255,255,255,0.4); font-size: 8px; font-family: 'Segoe UI', Arial, sans-serif; }
      .title { fill: #00d4ff; font-size: 20px; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif; }
      .subtitle { fill: rgba(255,255,255,0.5); font-size: 11px; font-family: 'Segoe UI', Arial, sans-serif; }
      .legend-text { fill: #e8f0f8; font-size: 10px; font-family: 'Segoe UI', Arial, sans-serif; }
      .track-num { fill: rgba(255,255,255,0.5); font-size: 9px; font-family: 'Segoe UI', Arial, sans-serif; }
      .track-loop { stroke: #ffcc00; stroke-width: 3; stroke-linecap: round; fill: none; stroke-dasharray: 8,4; }
      .loop-label { fill: #ffcc00; font-size: 8px; font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1750" height="900"/>
  
  <!-- Title -->
  <text class="title" x="900" y="30" text-anchor="middle">DELHI SECTION - TRACK SCHEMATIC</text>
  <text class="subtitle" x="900" y="48" text-anchor="middle">NeuralRail Section Controller | 4 Routes | Delhi Hub</text>

  <!-- ============ NORTH LINE (Green) - PUNJAB/HARYANA ============ -->
  <!-- Direction Label -->
  <text class="direction-label" x="900" y="75" text-anchor="middle">↑ PUNJAB / HARYANA</text>
  <text class="track-num" x="870" y="95">T1</text>
  <text class="track-num" x="920" y="95">T2</text>
  
  <!-- Straight vertical tracks from top - reduced spacing (30px) -->
  <line class="track-north" x1="885" y1="100" x2="885" y2="170"/>
  <line class="track-north" x1="915" y1="100" x2="915" y2="170"/>
  
  <!-- Sonipat (furthest from Delhi on North line) -->
  <circle class="station-marker" cx="900" cy="175" r="7"/>
  <text class="station-label" x="960" y="170">SONIPAT</text>
  <text class="station-km" x="960" y="183">42 km</text>
  <text class="distance-label" x="840" y="140">10 km</text>
  
  <!-- Sonipat to Narela - straight -->
  <line class="track-north" x1="885" y1="182" x2="885" y2="250"/>
  <line class="track-north" x1="915" y1="182" x2="915" y2="250"/>
  
  <!-- Narela -->
  <circle class="station-marker" cx="900" cy="255" r="7"/>
  <text class="station-label" x="960" y="250">NARELA</text>
  <text class="station-km" x="960" y="263">32 km</text>
  <text class="distance-label" x="840" y="220">10 km</text>
  
  <!-- Narela to Old Delhi - STRAIGHT diagonal -->
  <line class="track-north" x1="885" y1="262" x2="885" y2="372"/>
  <line class="track-north" x1="915" y1="262" x2="915" y2="372"/>
  <text class="distance-label" x="840" y="320">25 km</text>
  
  <!-- Old Delhi Junction -->
  <circle class="station-marker" cx="900" cy="380" r="8"/>
  <text class="station-label" x="950" y="375">OLD DELHI JN</text>
  <text class="station-km" x="950" y="388">(DLI) 7 km</text>
  
  <!-- Old Delhi to New Delhi - STRAIGHT vertical -->
  <line class="track-north" x1="885" y1="388" x2="885" y2="430"/>
  <line class="track-north" x1="915" y1="388" x2="915" y2="430"/>

  <!-- ============ NEW DELHI HUB (Central) ============ -->
  <circle class="hub-marker" cx="900" cy="450" r="20"/>
  <text class="station-label" x="960" y="450">NEW DELHI</text>
  <text class="station-km" x="960" y="463">(NDLS - HUB)</text>

  <!-- ============ WEST LINE (Purple) - JAIPUR ============ -->
  <!-- Direction Label -->
  <text class="direction-label" x="30" y="400">← JAIPUR</text>
  <text class="track-num" x="70" y="425">T1</text>
  <text class="track-num" x="70" y="475">T2</text>
  
  <!-- Straight horizontal tracks from left edge -->
  <line class="track-west" x1="80" y1="435" x2="220" y2="435"/>
  <line class="track-west" x1="80" y1="465" x2="220" y2="465"/>
  
  <!-- Delhi Cantt -->
  <circle class="station-marker" cx="230" cy="450" r="7"/>
  <text class="station-label" x="230" y="520" text-anchor="middle">DELHI CANTT</text>
  <text class="station-km" x="230" y="533" text-anchor="middle">15 km</text>
  <text class="distance-label" x="150" y="415">8 km</text>
  
  <!-- Delhi Cantt to Sarai Rohilla - straight -->
  <line class="track-west" x1="237" y1="435" x2="420" y2="435"/>
  <line class="track-west" x1="237" y1="465" x2="420" y2="465"/>
  
  <!-- Sarai Rohilla -->
  <circle class="station-marker" cx="430" cy="450" r="7"/>
  <text class="station-label" x="430" y="520" text-anchor="middle">SARAI ROHILLA</text>
  <text class="station-km" x="430" y="533" text-anchor="middle">(DEE) 10 km</text>
  <text class="distance-label" x="330" y="415">7 km</text>
  
  <!-- Sarai Rohilla to Sadar Bazar - straight -->
  <line class="track-west" x1="437" y1="435" x2="620" y2="435"/>
  <line class="track-west" x1="437" y1="465" x2="620" y2="465"/>
  
  <!-- Sadar Bazar Junction -->
  <circle class="junction-marker" cx="640" cy="450" r="10"/>
  <text class="station-label" x="640" y="520" text-anchor="middle">SADAR BAZAR</text>
  <text class="junction-km" x="640" y="533" text-anchor="middle">(DSB) 4 km</text>
  <text class="distance-label" x="530" y="415">4 km</text>
  
  <!-- Sadar Bazar to Old Delhi (upper branch) - STRAIGHT diagonal tracks with wider spacing -->
  <line class="track-west" x1="650" y1="435" x2="870" y2="365"/>
  <line class="track-west" x1="650" y1="465" x2="870" y2="395"/>
  <text class="distance-label" x="760" y="415">4 km</text>
  
  <!-- Sadar Bazar to New Delhi (main straight track) -->
  <line class="track-west" x1="650" y1="450" x2="880" y2="450"/>

  <!-- ============ EAST LINE (Orange) - LUCKNOW/KANPUR ============ -->
  <!-- Direction Label - above tracks and loop -->
  <text class="direction-label" x="1660" y="350" text-anchor="end">LUCKNOW →</text>
  <text class="direction-label" x="1660" y="365" text-anchor="end">KANPUR →</text>
  <text class="track-num" x="1670" y="430">T1</text>
  <text class="track-num" x="1670" y="478">T2</text>
  
  <!-- Straight horizontal tracks from right edge -->
  <line class="track-east" x1="1660" y1="435" x2="1500" y2="435"/>
  <line class="track-east" x1="1660" y1="465" x2="1500" y2="465"/>
  
  <!-- Ghaziabad -->
  <circle class="station-marker" cx="1490" cy="450" r="7"/>
  <text class="station-label" x="1490" y="520" text-anchor="middle">GHAZIABAD</text>
  <text class="station-km" x="1490" y="533" text-anchor="middle">25 km</text>
  <text class="distance-label" x="1570" y="415">18 km</text>
  
  <!-- Ghaziabad to Anand Vihar - straight -->
  <line class="track-east" x1="1483" y1="435" x2="1250" y2="435"/>
  <line class="track-east" x1="1483" y1="465" x2="1250" y2="465"/>
  
  <!-- Anand Vihar -->
  <circle class="station-marker" cx="1240" cy="450" r="7"/>
  <text class="station-label" x="1240" y="520" text-anchor="middle">ANAND VIHAR</text>
  <text class="station-km" x="1240" y="533" text-anchor="middle">12 km</text>
  <text class="distance-label" x="1360" y="415">13 km</text>
  
  <!-- Anand Vihar to New Delhi - straight -->
  <line class="track-east" x1="1233" y1="435" x2="920" y2="435"/>
  <line class="track-east" x1="1233" y1="465" x2="920" y2="465"/>
  <text class="distance-label" x="1070" y="415">12 km</text>

  <!-- ============ SOUTH LINE (Cyan) - AGRA - 3 TRACKS ============ -->
  <!-- Track numbers for 3 tracks -->
  <text class="track-num" x="870" y="480">T1</text>
  <text class="track-num" x="893" y="480">T2</text>
  <text class="track-num" x="920" y="480">T3</text>
  
  <!-- New Delhi to Nizamuddin - 3 tracks (T1, T2, T3) -->
  <line class="track-south" x1="885" y1="470" x2="885" y2="530"/>
  <line class="track-south" x1="900" y1="470" x2="900" y2="530"/>
  <line class="track-south" x1="915" y1="470" x2="915" y2="530"/>
  <text class="distance-label" x="840" y="505">5 km</text>
  
  <!-- Nizamuddin -->
  <circle class="station-marker" cx="900" cy="535" r="7"/>
  <text class="station-label" x="960" y="530">NIZAMUDDIN</text>
  <text class="station-km" x="960" y="543">(NZM) 5 km</text>
  
  <!-- Nizamuddin to Faridabad - 3 tracks -->
  <line class="track-south" x1="885" y1="542" x2="885" y2="610"/>
  <line class="track-south" x1="900" y1="542" x2="900" y2="610"/>
  <line class="track-south" x1="915" y1="542" x2="915" y2="610"/>
  <text class="distance-label" x="840" y="580">20 km</text>
  
  <!-- Faridabad -->
  <circle class="station-marker" cx="900" cy="615" r="7"/>
  <text class="station-label" x="960" y="610">FARIDABAD</text>
  <text class="station-km" x="960" y="623">25 km</text>
  
  <!-- Faridabad to Palwal - T3 merges into T1/T2 -->
  <line class="track-south" x1="885" y1="622" x2="885" y2="690"/>
  <line class="track-south" x1="900" y1="622" x2="893" y2="660"/>
  <line class="track-south" x1="915" y1="622" x2="915" y2="690"/>
  <text class="distance-label" x="840" y="660">35 km</text>
  <text class="loop-label" x="925" y="645">T3 merge</text>
  
  <!-- Palwal - back to 2 tracks -->
  <circle class="station-marker" cx="900" cy="695" r="7"/>
  <text class="station-label" x="960" y="690">PALWAL</text>
  <text class="station-km" x="960" y="703">60 km</text>
  
  <!-- Palwal to Mathura - 2 tracks -->
  <line class="track-south" x1="885" y1="702" x2="885" y2="770"/>
  <line class="track-south" x1="915" y1="702" x2="915" y2="770"/>
  <text class="distance-label" x="840" y="740">81 km</text>
  
  <!-- Mathura Junction -->
  <circle class="junction-marker" cx="900" cy="775" r="8"/>
  <text class="station-label" x="960" y="770">MATHURA JN</text>
  <text class="station-km" x="960" y="783">141 km</text>
  
  <!-- Track numbers South (before Mathura) -->
  <text class="track-num" x="870" y="760">T1</text>
  <text class="track-num" x="920" y="760">T2</text>
  
  <!-- After Mathura Junction - 4 tracks split -->
  <line class="track-south" x1="885" y1="783" x2="870" y2="850"/>
  <line class="track-south" x1="893" y1="783" x2="890" y2="850"/>
  <line class="track-south" x1="907" y1="783" x2="910" y2="850"/>
  <line class="track-south" x1="915" y1="783" x2="930" y2="850"/>
  
  <!-- Track numbers after Mathura (4 tracks) -->
  <text class="track-num" x="855" y="865">T1</text>
  <text class="track-num" x="880" y="865">T2</text>
  <text class="track-num" x="905" y="865">T3</text>
  <text class="track-num" x="930" y="865">T4</text>
  
  <!-- Direction Label South -->
  <text class="direction-label" x="900" y="890" text-anchor="middle">↓ AGRA / SOUTH</text>

  <!-- ============ LEGEND (Top Right with padding) ============ -->
  <rect x="1410" y="70" width="280" height="165" rx="5" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text class="legend-text" x="1550" y="90" text-anchor="middle" font-weight="bold" fill="#ffffff">LEGEND</text>
  
  <line x1="1430" y1="110" x2="1470" y2="110" stroke="#00ff88" stroke-width="5"/>
  <text class="legend-text" x="1480" y="114">North Line (Punjab/Haryana)</text>
  
  <line x1="1430" y1="130" x2="1470" y2="130" stroke="#00d4ff" stroke-width="5"/>
  <text class="legend-text" x="1480" y="134">South Line (Agra)</text>
  
  <line x1="1430" y1="150" x2="1470" y2="150" stroke="#ff6b35" stroke-width="5"/>
  <text class="legend-text" x="1480" y="154">East Line (Lucknow/Kanpur)</text>
  
  <line x1="1430" y1="170" x2="1470" y2="170" stroke="#a855f7" stroke-width="5"/>
  <text class="legend-text" x="1480" y="174">West Line (Jaipur)</text>
  
  <line x1="1430" y1="190" x2="1470" y2="190" stroke="#ffcc00" stroke-width="3" stroke-dasharray="8,4"/>
  <text class="legend-text" x="1480" y="194">Loop/Siding</text>
  
  <circle cx="1450" cy="215" r="5" fill="#ff6b35" stroke="#ffffff" stroke-width="1"/>
  <text class="legend-text" x="1480" y="219">Junction</text>

  <!-- ============ LOOP LINES & SIDINGS (Straight Geometric Lines) ============ -->
  
  <!-- Loop Line at Ghaziabad (East Line) - Overtaking Loop - Rectangular -->
  <line class="track-loop" x1="1500" y1="435" x2="1500" y2="405"/>
  <line class="track-loop" x1="1500" y1="405" x2="1620" y2="405"/>
  <line class="track-loop" x1="1620" y1="405" x2="1620" y2="435"/>
  <text class="loop-label" x="1560" y="395">Overtaking Loop</text>
  
  <!-- Loop Line at Sadar Bazar Junction - Holding Loop - Rectangular -->
  <line class="track-loop" x1="620" y1="435" x2="620" y2="390"/>
  <line class="track-loop" x1="620" y1="390" x2="680" y2="390"/>
  <line class="track-loop" x1="680" y1="390" x2="680" y2="435"/>
  <text class="loop-label" x="650" y="380">Holding Loop</text>
  
  <!-- Loop Line at Nizamuddin (South Line) - Passing Loop - Rectangular -->
  <line class="track-loop" x1="885" y1="520" x2="850" y2="520"/>
  <line class="track-loop" x1="850" y1="520" x2="850" y2="550"/>
  <line class="track-loop" x1="850" y1="550" x2="885" y2="550"/>
  <text class="loop-label" x="815" y="538">Loop</text>

</svg>