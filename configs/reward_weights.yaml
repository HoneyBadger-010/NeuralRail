# Energy-aware reward weights per task.
#   reward = base_reward(delays + collisions + priority) - w_energy * clip(step_kwh / energy_ref_kwh, 0, 1)
# w_energy is kept small so energy is a tie-breaker, never overriding safety
# (a collision swings base reward by ~0.5; max energy penalty per step is w_energy).
# energy_ref_kwh ≈ p95 of the no-control baseline's per-step energy (calibrate via
# eval/run_eval.py --calibrate); these are sensible starting values.

# energy_ref_kwh values below are the calibrated p95 of no-control per-step
# energy (via `python -m eval.run_eval --task all --calibrate`).
basic_control:       {w_energy: 0.05, energy_ref_kwh: 48}
express_priority:    {w_energy: 0.05, energy_ref_kwh: 97}
junction_management: {w_energy: 0.05, energy_ref_kwh: 57}
rush_hour:           {w_energy: 0.04, energy_ref_kwh: 67}
