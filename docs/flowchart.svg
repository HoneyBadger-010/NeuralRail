<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="Verdana, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="380" rx="10" fill="#131110" stroke="rgba(236,229,216,0.12)"/>
  <text x="480" y="36" text-anchor="middle" fill="#f4791f" font-size="19" font-weight="bold" letter-spacing="3">ENERGY-AWARE  RL  CONTROL  LOOP</text>

  <!-- AGENT -->
  <rect x="60" y="68" width="330" height="184" rx="8" fill="#1b1815" stroke="rgba(236,229,216,0.16)"/>
  <text x="225" y="92" text-anchor="middle" fill="#a89f90" font-size="11" letter-spacing="2">AGENT — RL CONTROLLER</text>
  <rect x="86" y="106" width="278" height="52" rx="4" fill="#100e0c" stroke="rgba(236,229,216,0.16)"/>
  <text x="225" y="130" text-anchor="middle" fill="#ece5d8" font-size="13">Observation encoder</text>
  <text x="225" y="147" text-anchor="middle" fill="#a89f90" font-size="10">trains · signals · block occupancy</text>
  <rect x="86" y="170" width="278" height="60" rx="4" fill="#100e0c" stroke="#f4791f"/>
  <text x="225" y="195" text-anchor="middle" fill="#f4791f" font-size="13" font-weight="bold">PPO POLICY · MaskablePPO</text>
  <text x="225" y="213" text-anchor="middle" fill="#a89f90" font-size="10">trained · action-masked</text>

  <!-- ENVIRONMENT -->
  <rect x="570" y="68" width="330" height="184" rx="8" fill="#1b1815" stroke="rgba(236,229,216,0.16)"/>
  <text x="735" y="92" text-anchor="middle" fill="#a89f90" font-size="11" letter-spacing="2">ENVIRONMENT — RAILWAY SECTION</text>
  <rect x="596" y="106" width="278" height="52" rx="4" fill="#100e0c" stroke="rgba(236,229,216,0.16)"/>
  <text x="735" y="130" text-anchor="middle" fill="#ece5d8" font-size="13">Simulator</text>
  <text x="735" y="147" text-anchor="middle" fill="#a89f90" font-size="10">block-signalling · collisions</text>
  <rect x="596" y="170" width="278" height="60" rx="4" fill="#100e0c" stroke="#2fbfb0"/>
  <text x="735" y="195" text-anchor="middle" fill="#2fbfb0" font-size="13" font-weight="bold">ENERGY MODEL · physics</text>
  <text x="735" y="213" text-anchor="middle" fill="#a89f90" font-size="10">idle · brake · restart  →  kWh</text>

  <!-- action arrow (agent -> env), top -->
  <line x1="392" y1="150" x2="566" y2="150" stroke="#f4791f" stroke-width="2"/>
  <polygon points="566,145 575,150 566,155" fill="#f4791f"/>
  <text x="479" y="142" text-anchor="middle" fill="#f4791f" font-size="11">ACTION · set signals / hold trains</text>

  <!-- observation+reward arrow (env -> agent), bottom -->
  <line x1="568" y1="210" x2="394" y2="210" stroke="#2fbfb0" stroke-width="2"/>
  <polygon points="394,205 385,210 394,215" fill="#2fbfb0"/>
  <text x="479" y="228" text-anchor="middle" fill="#2fbfb0" font-size="11">OBSERVATION  +  REWARD</text>

  <!-- reward formula -->
  <rect x="220" y="278" width="520" height="42" rx="6" fill="#1b1815" stroke="rgba(47,191,176,0.45)"/>
  <text x="480" y="304" text-anchor="middle" fill="#ece5d8" font-size="13" font-family="'Courier New', monospace">reward = +arrival +on&#8209;time&#183;priority  &#8722; 2&#183;collisions  &#8722; w&#183;energy(kWh)</text>

  <!-- footer stat -->
  <text x="480" y="352" text-anchor="middle" fill="#a89f90" font-size="11">Trained PPO · 204,800 steps · reward 4.2 &#8594; 5.0 · energy/ep 240 &#8594; 111 kWh · 100% on&#8209;time · 0 collisions</text>
</svg>
